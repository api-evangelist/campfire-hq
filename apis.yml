aid: campfire-hq
url: https://raw.githubusercontent.com/api-evangelist/campfire-hq/refs/heads/main/apis.yml
name: Campfire
kind: company
description: Campfire is an AI-native ERP and accounting platform for high-growth startups
  and mid-market companies, unifying the general ledger, revenue recognition, accounts
  payable/receivable, reporting, and close management. Its "Ember" AI assistant automates
  transaction categorization, bank reconciliation, and revenue recognition. Campfire ships
  a documented REST developer API (api.meetcampfire.com) for custom accounting integrations
  and webhook-driven sync with tools like Stripe, Ramp, and Brex.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Accounting
- ERP
- General Ledger
- Revenue Recognition
- FinTech
- AI
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
